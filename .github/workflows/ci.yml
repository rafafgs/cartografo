# Continuous integration: lint, types and the whole suite, on every push and every PR.
#
# It exists because two tickets merged green in isolation and left `main` red
# with nobody knowing: outside the machine of whoever was developing, nothing
# ran the suite. The matrix covers the two ends the repository declares — 24 is
# the pin in `.nvmrc`, 22 is the nearest LTS above the `>=20.11.0` floor of
# `engines`.
#
# Two things the first real run (t217, execution
# https://github.com/rafafgs/cartografo/actions/runs/31971354766) taught, and
# that bite whoever comes next:
#
# 1. The push that CREATES a branch does not trigger this workflow; the pushes
#    after it do. A new branch, then, needs a `gh workflow run ci.yml --ref
#    <branch>` by hand to get its first run — that is exactly what the
#    `workflow_dispatch` below is here for.
# 2. The fleet and cross-machine dispatch tests really DO run on
#    `ubuntu-latest`, and they pass — they are not skipped. The runner has IPv4
#    outside loopback, so the `t.skip(...)` of
#    `packages/runner/test/controller/multi-runner-fleet.e2e.test.ts` and of
#    `packages/runner/test/controller/cross-machine-dispatch.e2e.test.ts` never
#    happens. The contrary premise, written in t191 and repeated in t217, was
#    wrong: CI covers the network paths, and a red one there is real.
name: CI

on:
  push:
  pull_request:
  # A manual trigger. The first push that registered this workflow created no
  # run at all, and without a trigger under our control the only way to try
  # again is to wait for another push to land right. Useful anyway: it forces a
  # run for diagnosis without dirtying the history with an empty commit.
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest

    strategy:
      # One red version does not cancel the other: knowing whether the problem
      # belongs to both or to only one is half the diagnosis.
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Caches `~/.npm` keyed on `package-lock.json`, with no hand-written
          # `actions/cache` step.
          cache: npm

      # `npm ci`, never `npm install`: it installs what the lockfile says, and
      # fails if the lockfile has diverged from `package.json` instead of
      # resolving the difference silently — it was a stale `node_modules` that
      # brought down 314 tests on one machine with nobody understanding why.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # The two groups (workspaces and root) always run, one after the other:
      # `scripts/run-all-tests.mjs` is what guarantees that one red does not
      # hide the state of the other.
      - run: npm test

      # A deterministic form of "no test writes outside `os.tmpdir()`": any
      # write inside the checkout shows up here as a new or modified file. What
      # is a legitimate artifact is already in `.gitignore`.
      # `always()` because a red suite is precisely when a stray write is most
      # likely — a test that breaks halfway is what leaves a file behind.
      # Without this the step is skipped in exactly the case it exists to catch,
      # and the result stays invisible.
      - name: No test writes inside the checkout
        if: always()
        run: |
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "The suite wrote inside the checkout:"
            echo "$changed"
            exit 1
          fi
