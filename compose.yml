# One container from the image: the control plane (D23, t250; D27, t549).
#
# The runner is not here on purpose. D23 puts it on the machine where the
# authenticated engine CLI and the target repository are, which is the host —
# see "Running in a container" in `README.md` for the one command that starts it
# beside this one.
#
# No top-level `version:` key: the Compose Specification dropped it, and a file
# that still carries one only gets a warning for its trouble.

services:
  # The only writer in the system (D1). It owns `/data`, and nothing else mounts
  # that volume.
  control-plane:
    build: .
    environment:
      # The one place the port is opened, and the reason it is here rather than
      # in the `Dockerfile`: inside a container the code's own `127.0.0.1`
      # default (`packages/core/src/index.ts`) is the container's own interface,
      # so a published port would reach nothing. Opening the address is a
      # decision, and a decision belongs where an operator reads it — not baked
      # into an image for everyone who ever runs it. Every `/v1` route is behind
      # a credential; `4317` on your host is not a public port.
      CARTOGRAFO_HOST: 0.0.0.0
      CARTOGRAFO_DB_PATH: /data/cartografo.db
    volumes:
      - cartografo-db:/data
    ports:
      - "4317:4317"

volumes:
  # Named, so that `docker compose down` and a rebuilt image both leave the
  # database where it was. Removing it is `docker compose down --volumes`, and
  # that really is the data gone.
  cartografo-db:
