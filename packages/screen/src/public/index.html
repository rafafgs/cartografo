<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cartografo — proposal inbox</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="/board">board</a>
        <a href="/executions">executions</a>
        <a href="/input-requests">questions</a>
        <a href="/graph-editor.html">graph</a>
      </nav>
      <h1>Proposal inbox</h1>
      <p class="lead">
        Every proposal is a hypothesis about the graph: a semantic diff, the evidence behind it
        and the metric it expects to move. Nothing enters the graph without passing through here.
      </p>
      <p class="controls">
        <button id="refresh" type="button">Refresh</button>
        <span id="notice" class="notice" role="status"></span>
      </p>
    </header>

    <main>
      <section class="column">
        <h2>Pending</h2>
        <ul id="pending-list" class="proposals"></ul>
      </section>

      <section class="column">
        <h2>History</h2>
        <ul id="history-list" class="proposals"></ul>
      </section>

      <section class="column">
        <h2>Detail</h2>
        <div id="detail" class="detail">Select a proposal.</div>
      </section>
    </main>

    <script type="module">
      import { mount } from './inbox.js';

      // The module takes the document and fetch as arguments instead of reaching
      // for the globals, which is what lets every piece of it be read (and, for
      // actions.js and diff.js, tested) outside a browser.
      mount(document, (input, init) => fetch(input, init));
    </script>
  </body>
</html>
